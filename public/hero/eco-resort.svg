<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="chaletRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#nightSky)" />

  <!-- Stars -->
  <circle cx="200" cy="120" r="2" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="450" cy="80" r="1.5" fill="#ffffff" fill-opacity="0.6" />
  <circle cx="800" cy="160" r="2" fill="#ffffff" fill-opacity="0.7" />
  <circle cx="1200" cy="100" r="2.5" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="1500" cy="140" r="1.5" fill="#ffffff" fill-opacity="0.5" />
  <circle cx="1750" cy="80" r="2" fill="#ffffff" fill-opacity="0.8" />

  <!-- Tropical Eco Resort Lagoon Reflection -->
  <path d="M 0 780 Q 960 720 1920 780 L 1920 1080 L 0 1080 Z" fill="#042f2e" fill-opacity="0.6" />

  <!-- Chalet 1 (Main Luxury Chalet) -->
  <g transform="translate(1000, 380)">
    <!-- Thatched / Coir Board Insulated Steep Tropical Roof -->
    <polygon points="400,80 750,380 50,380" fill="url(#chaletRoof)" stroke="#10b981" stroke-width="3" />
    <polygon points="400,90 730,370 70,370" fill="#064e3b" fill-opacity="0.5" />

    <!-- Wooden Stilt Platform & Walls -->
    <rect x="120" y="380" width="560" height="260" fill="#1c1917" stroke="#78350f" stroke-width="4" rx="8" />
    
    <!-- Warm Ambient Glass Door -->
    <rect x="250" y="440" width="300" height="200" fill="#fef08a" fill-opacity="0.15" stroke="#451a03" stroke-width="4" rx="4" />
    <!-- Lantern Warm Glow -->
    <circle cx="400" cy="500" r="180" fill="url(#lantern)" />

    <!-- Stilts -->
    <rect x="150" y="640" width="20" height="180" fill="#451a03" />
    <rect x="250" y="640" width="20" height="180" fill="#451a03" />
    <rect x="530" y="640" width="20" height="180" fill="#451a03" />
    <rect x="630" y="640" width="20" height="180" fill="#451a03" />

    <text x="400" y="360" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#34d399" text-anchor="middle">
      🍃 Whispering Palms Eco-Resort &bull; Galle
    </text>
  </g>

  <!-- Jungle foliage silhouette -->
  <path d="M 700 800 Q 800 500 950 680 T 1200 620 T 1500 650 T 1920 600 L 1920 1080 L 700 1080 Z" fill="#022c22" fill-opacity="0.7" />
</svg>
